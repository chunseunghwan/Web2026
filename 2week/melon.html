</head>
<body>
  <h1>멜론 차트</h1>
  <div class="rankings">인기 순위</div>

  <!-- 가수 선택 탭: JS가 songs 배열을 읽어서 자동으로 버튼을 만들어줌 -->
  <div class="artist-tabs" id="artistTabs"></div>

  <!-- 노래 카드가 그려질 영역 -->
  <div id="songList"></div>

  <script>
    // 노래 데이터: artist(가수)별로 묶여있지 않고 하나의 배열로 관리하고,
    // 화면에 그릴 때 artist 값을 기준으로 필터링한다.
    // (원래 있던 3곡은 전부 Frank Sinatra 곡이라 예시로 다른 가수 곡도 몇 개 추가해뒀음 -> 필요없으면 지우고 써도 됨)
    const songs = [
      {
        artist: "Frank Sinatra",
        title: "My Way",
        query: "노래방 My way",
        img: "https://picsum.photos/600/150?random=1"
      },
      {
        artist: "Frank Sinatra",
        title: "Fly Me To The Moon",
        query: "노래방 Fly me to the moon",
        img: "https://picsum.photos/600/150?random=2"
      },
      {
        artist: "Frank Sinatra",
        title: "That's Life",
        query: "노래방 That's life",
        img: "https://picsum.photos/600/150?random=3"
      },
      {
        artist: "IU",
        title: "Good Day",
        query: "노래방 좋은날 아이유",
        img: "https://picsum.photos/600/150?random=4"
      },
      {
        artist: "IU",
        title: "Through the Night",
        query: "노래방 밤편지 아이유",
        img: "https://picsum.photos/600/150?random=5"
      }
    ];

    const tabsEl = document.getElementById("artistTabs");
    const listEl = document.getElementById("songList");

    // songs 배열에서 중복 없이 가수 이름만 뽑아냄
    const artists = ["전체", ...new Set(songs.map(s => s.artist))];

    // 현재 화면에 필터링해서 보여주는 함수
    function renderSongs(selectedArtist) {
      listEl.innerHTML = "";

      const filtered = selectedArtist === "전체"
        ? songs
        : songs.filter(s => s.artist === selectedArtist);

      filtered.forEach(song => {
        const card = document.createElement("div");
        card.className = "container";
        card.innerHTML = `
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(song.query)}" target="_blank">
            <img src="${song.img}" alt="${song.title} 이미지">
            <div class="song-info">
              <div class="song-title">${song.title}</div>
              <div class="song-artist">${song.artist}</div>
            </div>
          </a>
        `;
        listEl.appendChild(card);
      });
    }

    // 가수 탭 버튼을 만들고 클릭 이벤트를 붙임
    function renderTabs(selectedArtist) {
      tabsEl.innerHTML = "";
      artists.forEach(artist => {
        const btn = document.createElement("button");
        btn.textContent = artist;
        if (artist === selectedArtist) btn.classList.add("active");
        btn.addEventListener("click", () => {
          renderTabs(artist);
          renderSongs(artist);
        });
        tabsEl.appendChild(btn);
      });
    }

    // 초기 화면: 전체 보기
    renderTabs("전체");
    renderSongs("전체");
  </script>
</body>
</html>
